<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>でちゃう！取材・来店スケジュール（VRChatギミック デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff4200; --yellow:#ffb400; --cream:#fff5cc; --ink:#3e3a39; --gray:#646464; --sub:#595757;
    --tile:150px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 35%,#2b2b36 0%,#121218 70%);
    font-family:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;
    color:var(--ink); overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #stage{position:relative; width:1600px; height:1000px; transform-origin:center center; flex:none}
  #board{
    position:absolute; inset:0; background:#fff; border-radius:18px; overflow:hidden;
    box-shadow:0 0 0 10px #2a2a2a, 0 0 0 14px #444, 0 30px 80px rgba(0,0,0,.6);
    display:flex; flex-direction:column;
  }
  /* header */
  .hd{height:112px; background:var(--orange); display:flex; align-items:center; justify-content:center; flex:none}
  .hd img{height:78px; display:block}
  .ttl{height:74px; display:flex; align-items:center; gap:14px; padding:0 44px; position:relative; flex:none}
  .ttl::after{content:""; position:absolute; left:44px; right:44px; bottom:0; height:4px;
    background:linear-gradient(90deg,var(--yellow) 0 50%,var(--orange) 50% 100%)}
  .ttl .ic{width:34px; height:26px; background:var(--orange); border-radius:5px; position:relative}
  .ttl .ic::before{content:""; position:absolute; width:12px; height:12px; border:3px solid #fff; border-radius:50%; left:8px; top:4px; box-sizing:border-box}
  .ttl .ic::after{content:""; position:absolute; width:5px; height:4px; background:#fff; right:4px; top:4px; border-radius:1px}
  .ttl h1{font-size:32px; font-weight:900; color:var(--sub); letter-spacing:.04em}
  .ttl .meta{margin-left:auto; font-size:19px; color:#888; font-weight:700}
  .ttl .meta b{color:var(--orange); font-size:24px; margin:0 2px}
  /* area buttons */
  .areas{display:grid; grid-template-columns:repeat(6,1fr); gap:12px 14px; padding:20px 44px 6px; flex:none}
  .areas button{
    font:700 19px/1 "Noto Sans JP",sans-serif; color:var(--orange); background:var(--cream);
    border:2px solid var(--orange); border-radius:999px; height:48px; cursor:pointer; white-space:nowrap;
    transition:background .15s,color .15s,transform .1s;
  }
  .areas button.sm{font-size:16px; letter-spacing:-.02em}
  .areas button:hover{background:#ffe9a6}
  .areas button:active{transform:scale(.97)}
  .areas button.on{background:var(--orange); color:#fff}
  .areas button.all{background:#fff; }
  .areas button.all.on{background:var(--orange)}
  /* grid */
  .gridwrap{flex:1; position:relative; padding:18px 44px 0; overflow:hidden}
  .grid{position:absolute; inset:18px 44px 0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:10px 30px}
  .grid.in{animation:slidein .45s ease-out both}
  .grid.out{animation:slideout .3s ease-in both}
  @keyframes slidein{from{opacity:0; transform:translateX(40px)} to{opacity:1; transform:none}}
  @keyframes slideout{from{opacity:1; transform:none} to{opacity:0; transform:translateX(-40px)}}
  .it{display:flex; gap:18px; align-items:flex-start; min-width:0}
  .th{width:var(--tile); height:var(--tile); flex:none; border-radius:4px; background-image:url(thumbs.jpg); background-repeat:no-repeat; background-color:#eee; box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .tx{min-width:0; padding-top:4px}
  .dt{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .dt .d{color:var(--orange); font-weight:900; font-size:27px; letter-spacing:-.01em}
  .dt .p{background:var(--gray); color:#fff; font-weight:700; font-size:17px; padding:3px 9px; border-radius:4px; white-space:nowrap}
  .shop{font-weight:900; font-size:25px; line-height:1.3; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:4px}
  .who{font-size:21px; line-height:1.35; color:#111; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .empty{grid-column:1/-1; grid-row:1/-1; display:flex; align-items:center; justify-content:center; font-size:30px; color:#999; font-weight:700}
  /* footer */
  .ft{height:96px; flex:none; display:flex; align-items:center; justify-content:center; gap:26px; position:relative}
  .ft .nav{width:52px; height:52px; border-radius:8px; border:none; background:#8a9aa8; color:#fff; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .ft .nav:hover{background:#71828f}
  .ft .pg{font-size:28px; font-weight:700; color:#555; min-width:150px; text-align:center; font-variant-numeric:tabular-nums}
  .ft .upd{position:absolute; right:44px; font-size:16px; color:#aaa}
  .ft .note{position:absolute; left:44px; bottom:18px; font-size:12px; line-height:1.5; color:#9a9a9a; letter-spacing:.01em}
  .ttl .meta .an{color:var(--sub); font-size:20px; margin-right:12px}
  .bar{position:absolute; left:0; right:0; bottom:0; height:8px; background:#f1e7df}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--yellow),var(--orange))}
  #cap{margin-top:22px; color:#9a9aa8; font-size:14px; text-align:center; line-height:1.7}
  #load{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; color:#aaa; font-weight:700; background:#fff; z-index:5}
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <div class="hd"><img src="logo.png" alt="でちゃう！PLUS"></div>
    <div class="ttl"><span class="ic"></span><h1>取材・来店スケジュール</h1><div class="meta" id="count"></div></div>
    <div class="areas" id="areas"></div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
    <div class="ft">
      <div class="note">※本ページには掲載ホール様のPRが含まれています。<br>※設定状況・公約等を示唆するものではございません。<br>※でちゃう！PLUSで行なっている取材はすべてガイドラインに遵守しております。</div>
      <button class="nav" id="prev" aria-label="前のページ">◀</button>
      <div class="pg" id="pg">- / -</div>
      <button class="nav" id="next" aria-label="次のページ">▶</button>
      <div class="upd" id="upd"></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div id="load">読み込み中…</div>
  </div>
</div>
<div id="cap">VRChatワールドギミック ブラウザ版 ／ でちゃう！公式サイトのスケジュールを30分おきに自動取得しています<br>エリア未選択時は全国の予定を自動送り（6秒ごと）。エリアボタンで絞り込み、もう一度押すか「全国」で解除。</div>

<script>
(() => {
  const PER = 9, INTERVAL = 6000, TILE = 150;
  const $ = id => document.getElementById(id);
  let data = null, list = [], page = 0, area = -1, t0 = 0, raf = 0;

  function fit(){
    const s = Math.min(innerWidth / 1640, (innerHeight - 70) / 1040);
    $('stage').style.transform = `scale(${s})`;
    $('stage').style.margin = `${(1000*s-1000)/2}px ${(1600*s-1600)/2}px`;
  }
  addEventListener('resize', fit); fit();

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function buildAreas(){
    const names = ['全国', ...data.areas];
    $('areas').innerHTML = names.map((n,i) =>
      `<button data-i="${i-1}" class="${i===0?'all ':''}${n.length>9?'sm':''}">${esc(n)}</button>`).join('');
    $('areas').querySelectorAll('button').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      setArea(i === area ? -1 : i);
    });
  }

  function setArea(i){
    area = i;
    list = area < 0 ? data.items : data.items.filter(x => x[5] & (1 << area));
    $('areas').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === area));
    $('count').innerHTML = `<span class="an">${esc(area < 0 ? '全国' : data.areas[area])}</span><b>${list.length}</b>件`;
    go(0, true);
  }

  function pages(){ return Math.max(1, Math.ceil(list.length / PER)); }

  function render(){
    const g = $('grid');
    const items = list.slice(page*PER, page*PER + PER);
    const sz = data.cols * TILE;
    g.innerHTML = items.length ? items.map(([d,p,shop,who,ti]) => {
      const x = (ti % data.cols) * TILE, y = Math.floor(ti / data.cols) * TILE;
      return `<div class="it"><div class="th" style="background-size:${sz}px auto;background-position:-${x}px -${y}px"></div>
        <div class="tx"><div class="dt"><span class="d">${esc(d)}</span><span class="p">${esc(p)}</span></div>
        <div class="shop">${esc(shop)}</div><div class="who">${esc(who)}</div></div></div>`;
    }).join('') : '<div class="empty">現在、このエリアの予定はありません</div>';
    $('pg').textContent = `${page+1} / ${pages()}`;
    g.classList.remove('out'); void g.offsetWidth; g.classList.add('in');
  }

  function go(p, instant){
    const n = pages();
    page = ((p % n) + n) % n;
    t0 = performance.now();
    if (instant) { render(); return; }
    const g = $('grid'); g.classList.remove('in'); g.classList.add('out');
    setTimeout(render, 280);
  }

  function tick(now){
    const k = Math.min(1, (now - t0) / INTERVAL);
    $('bar').style.width = (pages() > 1 ? k*100 : 0) + '%';
    if (k >= 1 && pages() > 1) go(page + 1);
    raf = requestAnimationFrame(tick);
  }

  $('prev').onclick = () => go(page - 1);
  $('next').onclick = () => go(page + 1);

  fetch('schedule.json').then(r => r.json()).then(j => {
    data = j;
    $('upd').textContent = `データ取得：${j.updated}`;
    buildAreas(); setArea(-1);
    const img = new Image(); img.onload = () => $('load').remove(); img.onerror = () => $('load').remove(); img.src = 'thumbs.jpg';
    requestAnimationFrame(tick);
  }).catch(e => { $('load').textContent = 'データを読み込めませんでした'; });
})();
</script>
</body>
</html>
